<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editing page</title>
    <link rel="stylesheet" href="eventjes.css">
    <link rel="stylesheet" href="style.css">
    <script src="src/edit.js" defer></script>
</head>
<body>
        <form action="save.php" method="post" class="editlayout">
            <div class="editQuickinfo">
                <div class="editimage">
                    <img id="EDITIMAGE" src="" alt="">
                </div>
                <div class="editImportant">
                    <input type="hidden" name="EDITID" id="EDITID">
                    <label for="EDITNAME">Name</label>
                    <input name="EDITNAME" id="EDITNAME"></input>
                    <label for="EDITSPECIALTY">specialty</label>
                    <input name="EDITSPECIALTY" id="EDITSPECIALTY"></input>
                    <label for="EDITSOURCE">source</label>
                    <input name="EDITSOURCE" type="text" id="EDITSOURCE"></input>
                </div>
            </div>
            <div class="editAll">
                <label for="EDITPHONE">Phone number</label>
                <input name="EDITPHONE" id="EDITPHONE">
                <label for="EDITEMAIL">Email</label>
                <input name="EDITEMAIL" id="EDITEMAIL">
                <label for="EDITDISABLE">Disabled</label>
                <input name="EDITDISABLE" type="button" id="EDITDISABLE">
                <label for="password">Password</label>
                <input name="password">
                <label for="EDITSAVE">Save Changes</label>
                <input type="submit" id="EDITSAVE" value="Save">
            </div>
        </form>
    </div>
</body>
</html>
