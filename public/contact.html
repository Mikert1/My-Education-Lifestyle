<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Lifestyle Education | Contact</title>
    <link rel="stylesheet" href="style.css">
    <script src="src/texts.js" defer></script>

<body class="bodycontact">
    <object data="object/navbar.html" class="navbarObject" id="navbarObject"></object>
    <div class="content-wrapper">
        <div class="contactformulier">

            <form action="send.php" method="post" class="form">
                <h2 id="19"></h2>
                <div class="input">
                    <label for="name">Volledige naam:</label><br>
                    <input type="text" id="name" name="name" required><br><br>
                </div>
                <div class="input">
                    <label for="email">E-mail:</label><br>
                    <input type="email" id="email" name="email" required><br><br>
                </div>
                <div class="input" class="options">
                    <label for="choice">Kies een onderwerp:</label><br>
                    <select id="choice" name="choice" required>
                        <option value="Mental health">Mental health</option>
                        <option value="Education">Education</option>
                    </select>
                    </select><br><br>
                </div>
                <div class="input" class="bericht">
                    <label for="message">Bericht:</label><br>
                    <textarea id="message" name="message" required></textarea><br><br>
                    <input type="submit" value="Stuur op" class="button">
                </div>
            </form>
        </div>
    </div>
    <object data="object/footer.html" class="footerobject" id="footerObject"></object>
