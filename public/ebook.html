<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Lifestyle Education | E-Books</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>
    <script src="src/pdf.js" defer type="module"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bodyebooks">
    <object data="object/navbar.html" class="navbarObject" id="navbarObject"></object>

        <button onclick="ClosePDF()" class="outline">Back</button>
        <button onclick="OpenPDF('pdf/10-Easy-Steps-to-Turning-Dreams-into-Reality.pdf')" class="outline">Dreams into Reality</button>
